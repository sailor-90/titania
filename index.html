<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TITANIA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TITANIA</title>
<style>
:root{--bg:#08142e;--txt:#f2f6fb;--sub:#cfe6f2;--glass:rgba(255,255,255,.14);--glass2:rgba(255,255,255,.22);--edge:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% 20%,#1a4fb8 0%,#0e2f6e 45%,#08142e 100%)}
#menu{min-height:100%;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;justify-content:space-between}
.ship{font-size:12px;letter-spacing:2px;color:var(--sub);text-transform:uppercase}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:5px 10px}
.pill i{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.pill.off i{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
h1{margin:14px 0 26px;font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.05;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;padding:16px;min-height:150px;color:var(--txt);text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s ease,background .15s ease;opacity:0;animation:up .5s ease forwards}
.card:active{transform:scale(.97);background:var(--glass2)}
.card .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 20px -6px var(--c1)}
.card svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:17px;font-weight:600;letter-spacing:-.2px}
.card .go{position:absolute;top:18px;right:16px;width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.wide{grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.card.wide .tx{flex:1}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#viewer{display:none;position:fixed;inset:0;background:#fff}
#frames{position:absolute;inset:0;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
#fab{position:fixed;z-index:10;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(8,20,46,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:.7;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#fab:active{opacity:1}
#fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
</style>
</head>
<body>
<main id="menu">
  <div class="top"><span></span><span class="pill" id="net"><i></i><em id="nettxt" style="font-style:normal">Online</em></span></div>
  <h1>TITANIA</h1>
  <div class="grid" id="grid"></div>
</main>
<section id="viewer" aria-label="Aplikasi">
  <div id="frames"></div>
  <button id="fab" aria-label="Kembali ke menu"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
</section>
<script src="apps.js"></script>
<script>
(function () {
  var ICONS = {
    scale: '<path d="M12 4v16M6 20h12M5 8h14M5 8l-3 7a3 3 0 0 0 6 0zM19 8l-3 7a3 3 0 0 0 6 0z"/>',
    route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    report: '<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',
    pin: '<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>'
  };
  var COLORS = { scale: ["#38bdf8", "#2563eb"], route: ["#a78bfa", "#6366f1"], compass: ["#34d399", "#0d9488"], report: ["#fbbf24", "#f97316"], pin: ["#fb7185", "#e11d48"] };
  function net() {
    var on = navigator.onLine, p = document.getElementById("net");
    p.className = "pill" + (on ? "" : " off"); document.getElementById("nettxt").textContent = on ? "Online" : "Offline";
  }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();
  var menu = document.getElementById("menu"), viewer = document.getElementById("viewer");
  var grid = document.getElementById("grid"), frames = document.getElementById("frames");
  var current = null, fab = document.getElementById("fab");

  TITANIA_APPS.forEach(function (a, i) {
    var b = document.createElement("button");
    var c = COLORS[a.icon] || ["#38bdf8", "#6366f1"];
    b.className = "card" + (i === TITANIA_APPS.length - 1 && TITANIA_APPS.length % 2 ? " wide" : ""); b.type = "button";
    b.style.cssText = "--c1:" + c[0] + ";--c2:" + c[1] + ";animation-delay:" + (i * 70) + "ms";
    b.innerHTML = '<div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[a.icon] || "") + '</svg></div><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><div class="tx"><b></b></div>';
    b.querySelector("b").textContent = a.name;
    b.addEventListener("click", function () { open(a.id, true); });
    grid.appendChild(b);
  });

  function frameOf(a) {
    var f = document.getElementById("f-" + a.id);
    if (!f) {
      f = document.createElement("iframe");
      f.id = "f-" + a.id; f.src = a.url; f.title = a.name;
      f.allow = "camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen";
      f.setAttribute("allowfullscreen", "");
      frames.appendChild(f);
    }
    return f;
  }
  function open(id, push) {
    var a = TITANIA_APPS.filter(function (x) { return x.id === id; })[0];
    if (!a) return show();
    current = a;
    Array.prototype.forEach.call(frames.children, function (f) { f.classList.remove("on"); });
    frameOf(a).classList.add("on");
    placeFab();
    menu.style.display = "none"; viewer.style.display = "flex";
    if (push) history.pushState({ app: id }, "", "#" + id);
  }
  function show() {
    current = null;
    viewer.style.display = "none"; menu.style.display = "block";
  }
  function goBack() { if (history.state && history.state.app) history.back(); else show(); }
  function clampFab(x, y) {
    return { x: Math.max(6, Math.min(window.innerWidth - 48, x)), y: Math.max(6, Math.min(window.innerHeight - 48, y)) };
  }
  function placeFab() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem("fabPos")); } catch (e) {}
    p = clampFab(p ? p.x * window.innerWidth : window.innerWidth - 52, p ? p.y * window.innerHeight : window.innerHeight * 0.42);
    fab.style.left = p.x + "px"; fab.style.top = p.y + "px";
  }
  var drag = null;
  fab.addEventListener("pointerdown", function (e) {
    drag = { sx: e.clientX, sy: e.clientY, ox: fab.offsetLeft, oy: fab.offsetTop, moved: false };
    try { fab.setPointerCapture(e.pointerId); } catch (err) {}
  });
  fab.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    drag.moved = true;
    var p = clampFab(drag.ox + dx, drag.oy + dy);
    fab.style.left = p.x + "px"; fab.style.top = p.y + "px";
  });
  fab.addEventListener("pointerup", function () {
    if (!drag) return;
    var moved = drag.moved; drag = null;
    if (moved) {
      try { localStorage.setItem("fabPos", JSON.stringify({ x: fab.offsetLeft / window.innerWidth, y: fab.offsetTop / window.innerHeight })); } catch (e) {}
    } else goBack();
  });
  fab.addEventListener("pointercancel", function () { drag = null; });
  window.addEventListener("resize", function () { if (current) placeFab(); });
  window.addEventListener("popstate", function () {
    var id = (history.state && history.state.app) || "";
    if (id) open(id, false); else show();
  });
  var h = location.hash.replace("#", "");
  if (h) { history.replaceState(null, "", location.pathname); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
